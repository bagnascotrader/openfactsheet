name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types, generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/generate_docs.py --check

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Cross-library tests against the committed R reference JSON always run;
      # empyrical/QuantStats checks are skipped here (see the cross-library job).
      - run: pytest --cov --cov-report=term

  ocr:
    name: OCR engine (RapidOCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # OpenCV (a RapidOCR dependency) needs these system libraries.
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e ".[dev,ocr]"
      - run: pytest -m ocr -rs
        env:
          OFS_REQUIRE_OCR: "1"  # a missing engine fails instead of skipping

  manual:
    name: Reference manual (Typst)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,docs]"
      # Fails on any formula, link or named destination that does not compile.
      - run: python scripts/build_manual.py
      - run: pytest -m manual -rs
        env:
          OFS_REQUIRE_TYPST: "1"  # a missing compiler fails instead of skipping
      - uses: actions/upload-artifact@v4
        with:
          name: openfactsheet-manual
          path: docs/manual/build/openfactsheet-manual.pdf
          if-no-files-found: error

  cross-library:
    name: Cross-library validation (empyrical, QuantStats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,validation]"
      - run: pytest -m cross_library -rs
