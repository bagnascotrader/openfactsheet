[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openfactsheet"
dynamic = ["version"]
description = "Standardized, transparent investment performance analytics without metric cherry-picking."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrés A. Bagnasco" }, { name = "OpenFactsheet contributors" }]
keywords = [
    "finance",
    "performance",
    "factsheet",
    "risk",
    "sharpe",
    "drawdown",
    "hedge-funds",
    "portfolio-analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
# PDF ingestion reads embedded text (decision 0030); OCR of images and scanned pages uses a
# local engine with its bundled models, never a network call (decision 0031).
pdf = ["pypdf>=4.0"]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.17", "pypdfium2>=4", "Pillow>=10", "pypdf>=4.0"]
tesseract = ["pytesseract>=0.3.10", "pypdfium2>=4", "Pillow>=10", "pypdf>=4.0"]
images = ["openfactsheet[ocr]"]
# Builds the PDF reference manual from a source checkout (decision 0034). The
# compiler is pinned exactly: the committed PDF records the version it was built with.
docs = ["typst==0.15.0", "pikepdf>=9", "pypdf>=4.0"]
validation = [
    "empyrical-reloaded>=0.5",
    "quantstats>=0.0.62",
    "skfolio>=0.7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "detect-secrets>=1.5",
    "pre-commit>=3.7",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "Pillow>=10",
    "tomli>=2; python_version < '3.11'",
]
all =["openfactsheet[excel,pdf,ocr]"]

[project.urls]
Homepage = "https://github.com/bagnascotrader/openfactsheet"
Documentation = "https://github.com/bagnascotrader/openfactsheet/tree/main/docs"
Issues = "https://github.com/bagnascotrader/openfactsheet/issues"

[tool.hatch.version]
path = "src/openfactsheet/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openfactsheet"]

[tool.hatch.build.targets.sdist]
include = [
    "src/openfactsheet",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "DISCLAIMER.md",
    "THIRD_PARTY_NOTICES.md",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "cross_library: numerical comparison against reference implementations",
    "ocr: runs a real OCR engine (needs the ocr extra)",
    "golden: full-report regression fixtures",
    "manual: compiles the PDF reference manual (needs the docs extra)",
]
filterwarnings = [
    "error::RuntimeWarning:openfactsheet.*",
]

[tool.coverage.run]
source = ["openfactsheet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD", "C4", "PT", "RET"]
ignore = [
    "PD011",  # ReturnSeries.values is our own NumPy array attribute, not pandas `.values`
    "RET504", # explicit intermediate variables aid readability in formulas
    "RUF001", # unicode in docstrings/strings (e.g. minus sign handling) is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PD", "B011"]

[tool.mypy]
# Recent NumPy stubs use Python 3.12 syntax, so type analysis runs as 3.12.
# Source compatibility with 3.10 is enforced by ruff (target-version) and CI.
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/openfactsheet"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "statsmodels.*",
    "openpyxl.*",
    "rapidocr.*",
    "pytesseract.*",
    "pypdfium2.*",
    "typst.*",
    "tomli.*",
    "pikepdf.*",
]
ignore_missing_imports = true
